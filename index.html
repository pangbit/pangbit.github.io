<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pangbit@playground</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Courier New', 'Lucida Console', Monaco, monospace;
      color: #00ff41;
      height: 100vh;
      width: 100vw;
    }

    /* ── Fullscreen background canvas ── */
    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── Terminal window ── */
    #terminal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 800px;
      width: 90%;
      max-height: 80vh;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #333;
      border-radius: 8px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 0 40px rgba(0, 255, 65, 0.05),
        0 20px 60px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transition: opacity 0.3s ease;
    }

    /* ── Title bar ── */
    #title-bar {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: rgba(30, 30, 30, 0.95);
      border-bottom: 1px solid #333;
      user-select: none;
      flex-shrink: 0;
    }

    #title-bar .dots {
      display: flex;
      gap: 7px;
      margin-right: 14px;
    }

    #title-bar .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    #title-bar .dot.red    { background: #ff5f57; }
    #title-bar .dot.yellow { background: #febc2e; }
    #title-bar .dot.green  { background: #28c840; }

    #title-bar .title {
      flex: 1;
      text-align: center;
      color: #888;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    /* Spacer to keep title centered despite dots on left */
    #title-bar .spacer {
      width: 57px; /* matches dots width */
    }

    /* ── Output area ── */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 8px;
      color: #00ff41;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 120px;
    }

    #output::-webkit-scrollbar {
      width: 6px;
    }

    #output::-webkit-scrollbar-track {
      background: transparent;
    }

    #output::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    #output::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* ── Input line ── */
    #input-line {
      display: flex;
      align-items: center;
      padding: 10px 18px 14px;
      flex-shrink: 0;
      position: relative;
    }

    #input-line .prompt {
      color: #00aaff;
      font-size: 14px;
      font-weight: bold;
      margin-right: 8px;
      user-select: none;
      flex-shrink: 0;
    }

    #input-line .input-display {
      display: flex;
      align-items: center;
      flex: 1;
      min-height: 20px;
      font-size: 14px;
    }

    #input-line .input-text {
      color: #00ff41;
      white-space: pre;
    }

    /* Blinking block cursor */
    #input-line .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #00ff41;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    /* Hidden input that captures keystrokes */
    #hidden-input {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      font-size: 14px;
      font-family: inherit;
    }

    /* ── Output line styling ── */
    .line {
      margin: 0;
      padding: 0;
    }

    .line-prompt {
      color: #00aaff;
      font-weight: bold;
    }

    .line-cmd {
      color: #00ff41;
    }

    .line-error {
      color: #ff4444;
    }

    .line-info {
      color: #888;
    }

    .line-accent {
      color: #00aaff;
    }

    /* ── Selection color ── */
    ::selection {
      background: rgba(0, 170, 255, 0.3);
      color: #fff;
    }

    /* ── Responsive tweaks ── */
    @media (max-height: 500px) {
      #terminal {
        max-height: 90vh;
      }
      #output {
        padding: 10px 14px 6px;
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      #terminal {
        width: 96%;
        border-radius: 6px;
      }
      #output {
        padding: 12px 12px 6px;
        font-size: 13px;
      }
      #input-line {
        padding: 8px 12px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Background canvas for visual effects (matrix, stars, etc.) -->
  <canvas id="bg"></canvas>

  <!-- Terminal window -->
  <div id="terminal">

    <!-- Title bar with traffic-light dots -->
    <div id="title-bar">
      <div class="dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <span class="title">pangbit@playground</span>
      <span class="spacer"></span>
    </div>

    <!-- Scrollable output area -->
    <div id="output"></div>

    <!-- Input line with prompt, visible text, cursor, and hidden input -->
    <div id="input-line">
      <span class="prompt">$</span>
      <div class="input-display">
        <span class="input-text" id="input-mirror"></span>
        <span class="cursor" id="cursor"></span>
      </div>
      <input
        type="text"
        id="hidden-input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
    </div>

  </div>

  <!-- Scripts (loaded after DOM) -->
  <script src="js/terminal.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/life.js"></script>
  <script src="js/snake.js"></script>

</body>
</html>
